<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Isometric Room</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <style>
      #ui-hover-zone {
        position: fixed;
        top: 0;
        left: 0;
        width: 0; /* hover disabled */
        height: 0;
        z-index: 101;
        display: none;
      }
      #ui-container {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.75);
        padding: 10px;
        border-radius: 8px;
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 220px;
        /* Show by default (hover disabled) */
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.3s, visibility 0.3s;
      }
      /* Hover behavior removed */
      /* Also keep the panel open/interactive while it is hovered (via JS class) */
      #ui-container.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #ui-container h3 {
        margin: 0 0 10px 0;
        padding: 0;
        text-align: center;
        border-bottom: 1px solid #555;
        padding-bottom: 5px;
      }
      #ui-container label {
        display: block;
        margin-bottom: 5px;
      }
      #ui-container input[type="file"],
      #ui-container button,
      #ui-container select {
        width: 100%;
        box-sizing: border-box;
      }
       #ui-container button {
        padding: 8px;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 5px;
        cursor: pointer;
       }
       #ui-container button:hover {
        background: #555;
       }
       .ui-section {
        padding-top: 10px;
        border-top: 1px solid #555;
       }
       .ui-flex-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
       }
       .window-controls {
        display: flex;
        gap: 5px;
       }
       .window-controls button {
        flex-grow: 1;
      }
    </style>
  </head>

  <body style="background: transparent; overflow: hidden;">
    <script>
      // Early global error hooks to capture parse/runtime errors before UI init
      window.addEventListener('error', (e) => { try { window.electronAPI?.log?.('error', 'global.error', String(e?.message||e), 'at', e?.filename||'', e?.lineno||'', e?.colno||''); } catch {} });
      window.addEventListener('unhandledrejection', (e) => { try { window.electronAPI?.log?.('error', 'global.unhandledrejection', String(e?.reason||e)); } catch {} });
    </script>
    <!-- Picking HUD (bottom-left) -->
    <style>
      #pickHud { position: fixed; left: 10px; bottom: 10px; z-index: 200; display: flex; gap: 6px; align-items: center; }
      .hudBadge { background: rgba(0,0,0,0.5); color: #ddd; font: 12px/1.2 sans-serif; padding: 4px 8px; border-radius: 6px; pointer-events: none; }
      #pickStatus.hudBadge { min-width: 90px; text-align: center; }
      #pickName.hudBadge { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
    <div id="pickHud">
      <div id="pickStatus" class="hudBadge">Picking: On</div>
      <div id="pickName" class="hudBadge">(none)</div>
    </div>
    <!-- Build badge (bottom-right) -->
    <style>
      #buildBadge { position: fixed; right: 10px; bottom: 10px; z-index: 200; background: rgba(0,0,0,0.5); color: #ddd; font: 12px/1.2 sans-serif; padding: 4px 8px; border-radius: 6px; pointer-events: none; }
    </style>
    <div id="buildBadge">Starting…</div>
    <div id="ui-hover-zone"></div>
    <div id="ui-container">
        <h3>Controls</h3>
        <div class="ui-section ui-flex-row">
          <label for="pinPanelCheckbox" style="margin:0;">Pin Panel</label>
          <input type="checkbox" id="pinPanelCheckbox" checked>
        </div>
        <!-- Removed legacy Picture Frame/TV controls -->
        <div class="ui-section" id="surfacePicker">
          <label>Surface Picker</label>
          <div id="selectedSurfaceName" style="margin:4px 0; opacity:0.8;">Selected: none</div>
          <div class="ui-flex-row" style="gap:6px;">
            <button id="togglePickingBtn">Picking: On</button>
            <button id="openProjectionEditorBtn">Projection Editor</button>
          </div>
        </div>
        <div class="ui-section">
          <button id="resetViewBtn">Reset View</button>
        </div>
        <div class="ui-section">
          <label>Model Auswahl</label>
          <select id="modelSelect">
            <option value="models/room.glb">room.glb</option>
            <option value="models/city.glb">city.glb</option>
          </select>
          <button id="loadModelBtn" style="margin-top:5px;">Load Model</button>
        </div>
        <div class="ui-section">
          <label for="importModelInput">Import GLB</label>
          <input type="file" id="importModelInput" accept="model/gltf-binary,.glb" />
        </div>
        <!-- Removed Generator from menu -->
        <div class="ui-section ui-flex-row">
          <label for="transparentBgCheckbox">Transparent BG</label>
          <input type="checkbox" id="transparentBgCheckbox">
        </div>
        <div class="ui-section ui-flex-row">
          <label for="autoRestoreWebcams">Auto Restore Webcams</label>
          <input type="checkbox" id="autoRestoreWebcams">
        </div>
        <div class="ui-section">
          <label>Audio Reactivity</label>
          <div class="ui-flex-row" style="gap:6px; align-items: center;">
            <select id="audioSourceSelect">
              <option value="tv">TV Stream</option>
              <option value="system">System Audio</option>
              <option value="mic">Mikrofon</option>
            </select>
            <button id="toggleAudioBtn">Start Audio</button>
          </div>
          <div id="audioStatus" style="margin-top:6px; opacity:0.8;">Status: idle</div>
        </div>
        <div class="ui-section">
          <button id="toggleDevToolsBtn">DevTools</button>
        </div>
        <div class="ui-section window-controls">
          <button id="minimizeBtn">-</button>
          <button id="maximizeBtn">[]</button>
          <button id="closeBtn">X</button>
        </div>
      </div>
    </div>
    <!-- Right-side Projection Editor Panel -->
    <style>
      #projectionPanel {
        position: fixed;
        top: 10px;
        right: -320px; /* hidden offscreen */
        background: rgba(0,0,0,0.75);
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        border-radius: 8px;
        padding: 10px;
        width: 280px;
        z-index: 100;
        transition: right 0.25s ease-in-out;
      }
      #projectionPanel.open { right: 10px; }
    </style>
    <div id="projectionPanel">
      <h3 style="margin:0 0 10px 0; padding:0; text-align:center; border-bottom:1px solid #555; padding-bottom:5px;">Projection Editor</h3>
      <div class="ui-section">
        <label>Configured Projections</label>
        <div class="ui-flex-row" style="gap:6px; align-items:center;">
          <select id="projectionsSelect" style="flex:1; width:100%"></select>
          <button id="activateProjectionBtn" title="Activate selection">Use</button>
        </div>
      </div>
      <div class="ui-section">
        <label>Projection Name</label>
        <input type="text" id="projName" placeholder="My Projection" style="width:100%" />
      </div>
      <div class="ui-section">
        <label>Surface Name</label>
        <input type="text" id="surfaceAlias" placeholder="Wall A" style="width:100%" />
      </div>
      <div class="ui-section">
        <label>Surface Select</label>
        <select id="surfaceSelect" style="width:100%"></select>
      </div>
      <div class="ui-section">
        <label>Source</label>
        <select id="sourceType" style="width:100%">
          <option value="none">None</option>
          <option value="image">Image</option>
          <option value="webcam">Webcam</option>
        </select>
        <input type="file" id="sourceImageInput" accept="image/*" style="display:none; margin-top:6px; width:100%" />
        <select id="sourceCameraSelect" style="display:none; margin-top:6px; width:100%"></select>
        <div class="ui-flex-row" id="webcamButtons" style="display:none; margin-top:6px;">
          <button id="startProjWebcamBtn">Start</button>
          <button id="stopProjWebcamBtn" style="display:none;">Stop</button>
        </div>
      </div>
      <div class="ui-section">
        <label>Adjustments</label>
        <div class="ui-flex-row"><span>Zoom</span><input type="range" id="selZoom" min="0.1" max="3" step="0.05" value="1"></div>
        <div class="ui-flex-row"><span>Offset X</span><input type="range" id="selOffsetX" min="-1" max="1" step="0.01" value="0"></div>
        <div class="ui-flex-row"><span>Offset Y</span><input type="range" id="selOffsetY" min="-1" max="1" step="0.01" value="0"></div>
        <label for="selFit" style="margin-top: 5px;">Fit Mode</label>
        <select id="selFit"><option value="cover">Cover</option><option value="contain">Contain</option><option value="stretch">Stretch</option></select>
        <button id="selReset" style="margin-top:5px; width:100%">Reset</button>
      </div>
      <div class="ui-section ui-flex-row">
        <button id="saveProjectionBtn">Save</button>
        <button id="closeProjectionBtn">Close</button>
      </div>
    </div>
    <div id="loader"></div>
    <div id="container"></div>
    <!-- Import maps polyfill -->
    <!-- Remove this when import maps will be widely supported -->
    <script async src="./js/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./js/threejs/three.module.js",
          "three/addons/": "./js/threejs/jsm/"
        }
      }
    </script>
    <script type="text/javascript">
      //Global variables
      var fps = 24;
      var camera,
        scene,
        renderer,
        gltfScene,
        THREE,
        musicLight,
        soundbarMaterial,
        musicLightIntensity = 50 / 1,
        cameraContainer,
        isSignalNotFound,
        isDebugging = true,
        orbitalControl;

      let currentWebcamStream = null;
      let currentTvStream = null;
      let canvasTexturePhoto; // Make this global to revert to it

      //Using two separate canvas to simplify code
      let canvasArtist = document.createElement("canvas");
      let canvasClock = document.createElement("canvas");
      let canvasPhoto = document.createElement("canvas");
      canvasArtist.width = 640;
      canvasArtist.height = 360;
      canvasPhoto.width = 360;
      canvasPhoto.height = 640;
      canvasClock.width = canvasClock.height = 300;
    </script>
    <script type="module">
      import * as THREE_MODULE from "three";
      window.THREE = THREE_MODULE;
      const THREE = window.THREE;

      import Stats from "three/addons/libs/stats.module.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      // GLTFExporter is optional; we will lazy-load it on demand
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { FilmPass } from "three/addons/postprocessing/FilmPass.js";

      // Expose GLTFLoader to non-module code paths (e.g., import handler)
      window.GLTFLoaderRef = GLTFLoader;

      let composer;
      let canvasTextureArtist, canvasTextureClock;
      let htmlVideoScreenObject;
      let htmlVideo = document.createElement("video");
      htmlVideo.src = `textures/no_signal.webm`;
      htmlVideo.muted = true;
      htmlVideo.loop = true;
      htmlVideo.play();

      // Create a reusable video material for the "no signal" overlay object
      let videoTexture = null;
      let videoMaterial = null;
      try {
        videoTexture = new THREE.VideoTexture(htmlVideo);
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.minFilter = THREE.NearestFilter;
        videoTexture.maxFilter = THREE.NearestFilter;
        videoTexture.generateMipmaps = false;
        videoTexture.flipY = false;
        videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, transparent: false });
      } catch (e) { console.warn('Video texture init failed:', e); }

      const frustumSize = 20,
        resizeWidth = false;

      let houseGroup = null;
      let raycaster, mouse, hoveredMesh = null, hoverEdges = null, hoverOverlay = null, selectedSurface = null;
      let pickingEnabled = true;
      // Expose pick state to non-module scripts
      try {
        window.getPickingEnabled = () => pickingEnabled;
        window.setPickingEnabled = (v) => { pickingEnabled = !!v; };
      } catch {}

      // On-screen picking status
      function updatePickStatus(extra) {
        try {
          const el = document.getElementById('pickStatus'); if (!el) return;
          const state = pickingEnabled ? 'On' : 'Off';
          el.textContent = extra ? `Picking: ${state} • ${extra}` : `Picking: ${state}`;
          const nameEl = document.getElementById('pickName');
          if (nameEl) nameEl.textContent = extra ? (String(extra).split(' • ')[0] || '(mesh)') : '(none)';
        } catch {}
      }
      // Expose selectedSurface for non-module scripts
      try { Object.defineProperty(window, 'selectedSurface', { get(){return selectedSurface;}, set(v){selectedSurface=v;} }); } catch {}
      const surfaceOriginalMaterials = new Map();
      const surfaceStreams = new Map(); // uuid -> MediaStream
      let currentModelPath = 'models/room.glb';
      try { window.currentModelPath = currentModelPath; } catch {}
      let profile = { models: {} };
      let saveProfileDebounce = null;
      function debounceSaveProfile() {
        clearTimeout(saveProfileDebounce);
        saveProfileDebounce = setTimeout(async () => {
          try { await window.electronAPI?.saveConfig?.(profile); } catch {}
        }, 300);
      }
      function init() {
        const container = document.getElementById("container");
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Raycaster for surface picking
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        composer = new EffectComposer(renderer);
        window.addEventListener("resize", onWindowResize);

        let aspect = window.innerWidth / window.innerHeight;
        camera = new THREE.OrthographicCamera(
          (-aspect * frustumSize) / 2,
          (aspect * frustumSize) / 2,
          frustumSize / 2,
          -frustumSize / 2,
          0.25,
          1000
        );
        camera.zoom = 1.25;
        camera.updateProjectionMatrix();
        cameraContainer = new THREE.Object3D();
        cameraContainer.add(camera);
        cameraContainer.rotation.x = (Math.PI / 180) * -30;
        cameraContainer.rotation.y = (Math.PI / 180) * 30;

        orbitalControl = new OrbitControls(camera, container);
        orbitalControl.enableDamping = true;
        orbitalControl.minDistance = 18;
        orbitalControl.maxDistance = 50;
        orbitalControl.target.set(0, 0, -0.1);
        orbitalControl.enabled = isDebugging;
        orbitalControl.update();
        orbitalControl.saveState();

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101010);
        
        const ambientLight = new THREE.AmbientLight( 0xffffff, 1 );
        scene.add( ambientLight );

        musicLight = new THREE.PointLight(0x2d2d2d, musicLightIntensity, 5);
        musicLight.position.set(0, 1.25, -3.75);
        scene.add(musicLight);

        let roomLight = new THREE.PointLight(0xcecca7, 4, 8);
        roomLight.position.set(-3.5, 2, 1.5);
        scene.add(roomLight);

        const shadowLight = new THREE.SpotLight(0xffffff, 0.1);
        shadowLight.position.set(0, 75, 0);
        shadowLight.castShadow = true;
        scene.add(shadowLight);

        soundbarMaterial = new THREE.MeshStandardMaterial();
        soundbarMaterial.color = new THREE.Color(0x2d2d2d);

        // Bottom shadow plane created once
        const planeGeometry = new THREE.PlaneGeometry(25, 25);
        const bottomPlane = new THREE.Mesh(
          planeGeometry,
          new THREE.ShadowMaterial({})
        );
        bottomPlane.receiveShadow = true;
        bottomPlane.position.set(0, -2.5, 0);
        bottomPlane.rotation.x = (Math.PI / 180) * -90;
        scene.add(bottomPlane);

        // Shared canvas textures/materials
        canvasTextureArtist = new THREE.CanvasTexture(canvasArtist);
        canvasTextureArtist.encoding = THREE.sRGBEncoding;
        canvasTextureArtist.flipY = false;
        const canvasMaterialArtist = new THREE.MeshBasicMaterial({ map: canvasTextureArtist, transparent: false });
        window.canvasMaterialArtist = canvasMaterialArtist; // Store for later use

        window.canvasTexturePhoto = new THREE.CanvasTexture(canvasPhoto);
        window.canvasTexturePhoto.encoding = THREE.sRGBEncoding;
        window.canvasTexturePhoto.flipY = false;
        window.canvasTexturePhoto.wrapS = THREE.RepeatWrapping;
        window.canvasTexturePhoto.wrapT = THREE.RepeatWrapping;
        window.canvasTexturePhoto.rotation = (Math.PI / 180) * -90;

        const canvasMaterialPhoto = new THREE.MeshBasicMaterial({ map: window.canvasTexturePhoto, transparent: false });
        canvasMaterialPhoto.map.offset.set(-0.003, 0);

        canvasTextureClock = new THREE.CanvasTexture(canvasClock);
        canvasTextureClock.flipY = false;
        canvasTextureClock.anisotropy = 4;
        const canvasMaterialClock = new THREE.MeshBasicMaterial({ map: canvasTextureClock, transparent: false });

        function applyBindings(root) {
          const screenArtist = root.getObjectByName('TV_SCREEN');
          const screenClock = root.getObjectByName('CLOCK_SCREEN');
          const screenPhoto = root.getObjectByName('PICTURE_FRAME');

          if (screenArtist) screenArtist.material = canvasMaterialArtist;
          if (screenClock) screenClock.material = canvasMaterialClock;
          if (screenPhoto) screenPhoto.material = canvasMaterialPhoto;

          // If the loaded model doesn't include our named surfaces, create simple stand-ins
          function ensurePlane(name, width, height, material, position, rotationY = 0) {
            let obj = root.getObjectByName(name);
            if (!obj) {
              const geo = new THREE.PlaneGeometry(width, height);
              const mesh = new THREE.Mesh(geo, material.clone());
              mesh.name = name;
              mesh.position.copy(position);
              mesh.rotation.y = rotationY;
              root.add(mesh);
              return mesh;
            }
            return obj;
          }

          const defaultY = 1.5;
          const photo = ensurePlane('PICTURE_FRAME', 0.8, 1.2, canvasMaterialPhoto, new THREE.Vector3(0, defaultY, -2.0), 0);
          const tv = ensurePlane('TV_SCREEN', 1.6, 0.9, canvasMaterialArtist, new THREE.Vector3(2.0, 1.4, 0), -Math.PI / 2);

          if (screenArtist && videoMaterial) {
            // Recreate no-signal overlay for new TV screen
            if (htmlVideoScreenObject) scene.remove(htmlVideoScreenObject);
            const tvSrc = screenArtist || tv;
            htmlVideoScreenObject = tvSrc.clone(false);
            tvSrc.getWorldPosition(htmlVideoScreenObject.position);
            tvSrc.getWorldQuaternion(htmlVideoScreenObject.quaternion);
            htmlVideoScreenObject.position.set(
              htmlVideoScreenObject.position.x,
              htmlVideoScreenObject.position.y,
              htmlVideoScreenObject.position.z + 0.002
            );
            htmlVideoScreenObject.material = videoMaterial;
            scene.add(htmlVideoScreenObject);
          }
        }

        function frameToObject(obj) {
          try {
            const box = new THREE.Box3().setFromObject(obj);
            if (!box.isEmpty()) {
              const size = new THREE.Vector3();
              const center = new THREE.Vector3();
              box.getSize(size);
              box.getCenter(center);
              // Place object so its bottom sits at y = -2.5 (floor height)
              const bottomY = center.y - size.y / 2;
              obj.position.y += (-2.5 - bottomY);

              // Adjust camera target to object center at visible height
              if (window.orbitalControl) {
                window.orbitalControl.target.copy(new THREE.Vector3(center.x, -2.5 + Math.min(size.y, 3) * 0.5, center.z));
              }

              // Fit orthographic zoom to bounding sphere
              const radius = Math.max(size.x, size.y, size.z) / 2;
              const aspect = window.innerWidth / window.innerHeight;
              const margin = 1.2; // 20% padding
              const fitHeight = (frustumSize / (2 * radius * margin));
              const fitWidth = ((aspect * frustumSize) / (2 * radius * margin));
              const zoom = Math.min(fitHeight, fitWidth);
              if (window.camera) {
                window.camera.zoom = Math.max(0.2, Math.min(5, zoom));
                window.camera.updateProjectionMatrix();
              }
              window.orbitalControl?.update();
            }
          } catch (e) {
            console.warn('frameToObject failed:', e);
          }
        }

        function loadModel(modelPath) {
          window.electronAPI?.log?.('info', 'Load model start', modelPath);
          const loader = new GLTFLoader();
          loader.load(modelPath, (gltf) => {
            if (gltfScene) scene.remove(gltfScene);
            gltfScene = gltf.scene;
            gltfScene.position.set(0, -2.5, 0);
            applyBindings(gltf.scene);
            scene.add(gltf.scene);
            currentModelPath = modelPath; try { window.currentModelPath = currentModelPath; } catch {}
            loadProfileForCurrentModel();
            try {
              frameToObject(gltf.scene);
              const childCount = gltf.scene.children?.length || 0;
              window.electronAPI?.log?.('info', 'Load model success', modelPath, 'children:', childCount);
            } catch {}
            showScene();
            try { populateSurfaceDropdown(); } catch {}

            try {
              (function logSceneStats(root){
                let meshCount=0, triTotal=0, vertTotal=0;
                root.traverse((obj)=>{
                  if (obj.isMesh && obj.geometry) {
                    const pos = obj.geometry.attributes?.position; const idxA = obj.geometry.index?.array;
                    const tris = idxA ? Math.floor(idxA.length/3) : (pos ? Math.floor(pos.count/3) : 0);
                    const verts = pos ? pos.count : 0;
                    try { window.electronAPI?.log?.('info','mesh.stats',obj.name||'(mesh)','tris',tris,'verts',verts,obj.geometry.type||'BufferGeometry'); } catch {}
                    meshCount++; triTotal += tris; vertTotal += verts;
                  }
                });
                try { window.electronAPI?.log?.('info','scene.stats','meshes',meshCount,'tris',triTotal,'verts',vertTotal); } catch {}
              })(gltf.scene);
            } catch {}
          }, undefined, (err) => {
            console.error('Failed to load model', modelPath, err);
            window.electronAPI?.log?.('error', 'Load model error', modelPath, String(err));
            // Fallback to models/room.glb if any model fails to load
            if (!modelPath.endsWith('models/room.glb')) {
              console.warn('Falling back to models/room.glb');
              window.electronAPI?.log?.('warn', 'Fallback to models/room.glb');
              loader.load('models/room.glb', (gltf) => {
                if (gltfScene) scene.remove(gltfScene);
                gltfScene = gltf.scene;
                gltfScene.position.set(0, -2.5, 0);
                applyBindings(gltf.scene);
                scene.add(gltf.scene);
                frameToObject(gltf.scene);
                showScene();
            try { populateSurfaceDropdown(); } catch {}

              }, undefined, (err2) => {
                console.error('Fallback load failed', err2);
                alert('Failed to load model: ' + modelPath);
              });
            } else {
              alert('Failed to load model: ' + modelPath);
            }
          });
        }

        // Expose for non-module UI script
        window.loadModelRef = loadModel;

        // Load default model (room.glb)
        loadModel('models/room.glb');

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        // Watchdog: ensure loader hides even if model load callbacks delay
        setTimeout(() => { try { showScene();
            try { populateSurfaceDropdown(); } catch {}
 } catch {} }, 3000);
      }

      function meshBasicToStandardMesh(object) {
        let oldMat = object.material;
        let newMat = new THREE.MeshStandardMaterial();
        newMat.map = oldMat.map;
        object.material = newMat;
      }

      function onWindowResize() {
        let aspect = window.innerWidth / window.innerHeight;
        camera.left = (-aspect * frustumSize) / 2;
        camera.right = (aspect * frustumSize) / 2;
        camera.top = frustumSize / 2;
        camera.bottom = -frustumSize / 2;
        camera.updateProjectionMatrix();

        const worldZ = new THREE.Vector3(m.elements[8], m.elements[9], m.elements[10]).normalize();
        const axis = [worldX, worldY, worldZ][minIdx].clone();
        // Choose direction pointing toward camera if possible
        const camDir = new THREE.Vector3().subVectors(camera.position, box.getCenter(new THREE.Vector3())).normalize();
        if (axis.dot(camDir) < 0) axis.multiplyScalar(-1);

        function ensureGeometryIndex(geometry) {
          if (geometry.index) return geometry.index.array;

          const keyFor = (a, b) => a < b ? (a + '_' + b) : (b + '_' + a);
          for (let t = 0; t < triCount; t++) {

            const edges = [keyFor(i0, i1), keyFor(i1, i2), keyFor(i2, i0)];

            }

          const diag = bbox.getSize(new THREE.Vector3()).length() || 1;
          const distEps = diag * distEpsFactor;
          const cosThresh = Math.cos((angleThresholdDeg * Math.PI) / 180.0);
          const visited = new Uint8Array(adj.length);
          const outSet = new Set();
          const q = [startTri];
          const vTemp = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
          const startN = triNormalWorld(mesh, startTri, vTemp);
          while (q.length && outSet.size < maxTris) {
            const t = q.pop();
            if (visited[t]) continue;
            visited[t] = 1;
            // coplanarity test
            const vs = triVerticesWorld(mesh, t, vTemp);
            if (!vs) continue;
            const n = triNormalWorld(mesh, t, vTemp);
            if (!n) continue;
            const angleOk = Math.abs(n.dot(startN)) >= cosThresh;
            const d0 = Math.abs(plane.distanceToPoint(vs[0]));
            const d1 = Math.abs(plane.distanceToPoint(vs[1]));
            const d2 = Math.abs(plane.distanceToPoint(vs[2]));
            const distOk = (d0 < distEps && d1 < distEps && d2 < distEps);
            if (!angleOk || !distOk) continue;
            outSet.add(t);
            for (const nb of adj[t]) if (!visited[nb]) q.push(nb);
          }
          return { plane, tris: outSet };
        }

        function buildRegionOutlineLines(mesh, region) {
          const g = mesh.geometry;
          const index = g.index?.array || ensureGeometryIndex(g);
          if (!index || !region?.tris?.size) return null;
          const inRegion = region.tris;
          // count boundary edges
          const edgeCount = new Map();
          const inc = (a,b) => {
            const key = a < b ? (a+'_'+b) : (b+'_'+a);

          };
          inRegion.forEach((t) => {
            const a = index[3*t+0], b = index[3*t+1], c = index[3*t+2];
            inc(a,b); inc(b,c); inc(c,a);
          });
          const pos = g.attributes?.position;
          const pts = [];
          edgeCount.forEach((cnt, key) => {
            if (cnt === 1) { // boundary edge
              const [sa, sb] = key.split('_');
              const ia = parseInt(sa,10), ib = parseInt(sb,10);
              const va = new THREE.Vector3().fromBufferAttribute(pos, ia).applyMatrix4(mesh.matrixWorld);

        function updateFrameTexture() {
            const pictureFrame = window.gltfScene?.getObjectByName("PICTURE_FRAME");
            if (!pictureFrame || !pictureFrame.material.map) return;

            const texture = pictureFrame.material.map;
            const zoom = parseFloat(frameZoom?.value || 1);
            const offsetX = parseFloat(frameOffsetX?.value || 0);
            const offsetY = parseFloat(frameOffsetY?.value || 0);
            const fitMode = (frameFit?.value || 'cover');
        const selectedSurfaceName = document.getElementById('selectedSurfaceName');
        // legacy surface controls removed from left panel
        // legacy left-panel elements removed; declarations moved earlier as guarded lookups
        // Per-surface transform controls: use right panel controls
        const surfaceControls = {
          zoom: document.getElementById('selZoom'),
          ox: document.getElementById('selOffsetX'),
          oy: document.getElementById('selOffsetY'),
          fit: document.getElementById('selFit'),
          reset: document.getElementById('selReset')
        };

            // Target aspect ratio of the picture frame plane (it's portrait)
            const targetAspect = 3 / 4; 
            
            let sourceAspect = 1;
            if (texture.image) {
                if (texture.image.videoWidth) { // VideoTexture
                    sourceAspect = texture.image.videoWidth / texture.image.videoHeight;
                } else { // CanvasTexture or Texture
                    sourceAspect = texture.image.width / texture.image.height;
                }
            }

            let repeatX = 1, repeatY = 1;

            if (fitMode === 'stretch') {
                // Stretch to fill, ignore aspect ratio
            } else if (fitMode === 'contain') {
                // Fit entire image, preserving aspect (letterboxing)
                if (sourceAspect > targetAspect) {
                    repeatY = sourceAspect / targetAspect;
                } else {
                    repeatX = targetAspect / sourceAspect;
                }
            } else { // 'cover' is the default
                // Fill the frame, preserving aspect (cropping)
                if (sourceAspect > targetAspect) {
                    repeatX = targetAspect / sourceAspect;
                } else {
                    repeatY = sourceAspect / targetAspect;
                }
            }
            
            texture.repeat.set((1 / zoom) * repeatX, (1 / zoom) * repeatY);
            // Center the texture after scaling and then apply manual offset
            const centeredOffsetX = (1 - (1 / zoom) * repeatX) / 2;
            const centeredOffsetY = (1 - (1 / zoom) * repeatY) / 2;
            texture.offset.set(centeredOffsetX + offsetX, centeredOffsetY + offsetY);
        }

        if (frameZoom) {
          frameZoom.addEventListener('input', updateFrameTexture);
          frameOffsetX.addEventListener('input', updateFrameTexture);
          frameOffsetY.addEventListener('input', updateFrameTexture);
          frameFit.addEventListener('input', updateFrameTexture);
          resetFrameTransformBtn.addEventListener('click', () => {
              if (frameZoom) frameZoom.value = 1;
              if (frameOffsetX) frameOffsetX.value = 0;
              if (frameOffsetY) frameOffsetY.value = 0;
              if (frameFit) frameFit.value = 'cover';
              updateFrameTexture();
          });
        }

        // Guarded TV controls
        const tvZoom = document.getElementById("tvZoom");
        const tvOffsetX = document.getElementById("tvOffsetX");
        const tvOffsetY = document.getElementById("tvOffsetY");
        const tvFit = document.getElementById("tvFit");
        function updateTvTexture() {
            const tvScreen = window.gltfScene?.getObjectByName("TV_SCREEN");
            if (!tvScreen || !tvScreen.material.map) return;

            const texture = tvScreen.material.map;
            const zoom = parseFloat(tvZoom?.value || 1);
            const offsetX = parseFloat(tvOffsetX?.value || 0);
            const offsetY = parseFloat(tvOffsetY?.value || 0);
            const fitMode = tvFit?.value || 'cover';

            // Target aspect ratio of the TV screen plane (it's landscape)
            const targetAspect = 16 / 9; 
            
            let sourceAspect = 1;
            if (texture.image && texture.image.videoHeight) { // VideoTexture
                sourceAspect = texture.image.videoWidth / texture.image.videoHeight;
            }

            let repeatX = 1, repeatY = 1;

            if (fitMode === 'stretch') {
                // Stretch to fill, ignore aspect ratio
            } else if (fitMode === 'contain') {
                // Fit entire image, preserving aspect (letterboxing)
                if (sourceAspect > targetAspect) {
                    repeatY = sourceAspect / targetAspect;
                } else {
                    repeatX = targetAspect / sourceAspect;
                }
            } else { // 'cover' is the default
                // Fill the frame, preserving aspect (cropping)
                if (sourceAspect > targetAspect) {
                    repeatX = targetAspect / sourceAspect;
                } else {
                    repeatY = sourceAspect / targetAspect;
                }
            }
            
            texture.repeat.set((1 / zoom) * repeatX, (1 / zoom) * repeatY);
            // Center the texture after scaling and then apply manual offset
            const centeredOffsetX = (1 - (1 / zoom) * repeatX) / 2;
            const centeredOffsetY = (1 - (1 / zoom) * repeatY) / 2;
            texture.offset.set(centeredOffsetX + offsetX, centeredOffsetY + offsetY);
        }

        if (tvZoom) {
          tvZoom?.addEventListener('input', updateTvTexture);
          tvOffsetX?.addEventListener('input', updateTvTexture);
          tvOffsetY?.addEventListener('input', updateTvTexture);
          tvFit?.addEventListener('input', updateTvTexture);
          resetTvTransformBtn.addEventListener('click', () => {
              if (tvZoom) tvZoom.value = 1;
              if (tvOffsetX) tvOffsetX.value = 0;
              if (tvOffsetY) tvOffsetY.value = 0;
              if (tvFit) tvFit.value = 'cover';
              updateTvTexture();
          });
        }

        // Do not auto-start webcams; user can opt-in via controls/profile
        window.autoStartTv = false;
        populateCameraList();
        if (navigator.mediaDevices) navigator.mediaDevices.ondevicechange = populateCameraList;
        try { window.electronAPI?.log?.('info', 'UI init done'); } catch {}
    </script>
    <script>
      // Audio Reactivity with selectable source and profile persistence
      (function () {
        let audioCtx = null, analyser = null, rafId = null, audioStream = null, sourceNode = null;
        let cfg = {};

        function getEl(id) { return document.getElementById(id); }
        function setStatus(text) { const el = getEl('audioStatus'); if (el) el.textContent = 'Status: ' + text; }
        function getSelectedSource() { const s = getEl('audioSourceSelect'); return s ? s.value : (cfg?.audio?.source || 'system'); }

        async function startAudio(mode) {
          try {
            if (audioCtx) return;
            const src = mode || getSelectedSource();
            setStatus('starting ' + src + '...');
            let stream = null;

            if (src === 'tv') {
              if (window.currentTvStream) {
                stream = window.currentTvStream;
              } else {
                setStatus('TV stream not active');
                return;
              }
            } else if (src === 'mic') {
              if (!navigator.mediaDevices?.getUserMedia) { setStatus('getUserMedia unsupported'); return; }
              stream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false },
                video: false
              });
            } else { // 'system'
              if (!navigator.mediaDevices?.getDisplayMedia) { setStatus('getDisplayMedia unsupported'); return; }
              try {
                stream = await navigator.mediaDevices.getDisplayMedia({
                  audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                  video: false
                });
              } catch (errAudioOnly) {
                // Fallback: some Chromium builds require video:true to capture system audio
                try {
                  stream = await navigator.mediaDevices.getDisplayMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    video: true
                  });
                  // If video present, we still only use audio track; stop video tracks to save resources
                  try { stream.getVideoTracks().forEach(t => t.stop()); } catch {}
                } catch (errWithVideo) {
                  setStatus('system audio denied');
                  try { window.electronAPI?.log?.('error', 'Display capture failed', String(errWithVideo)); } catch {}
                  return;
                }
              }
            }

            audioStream = stream;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new Ctx();
            sourceNode = audioCtx.createMediaStreamSource(stream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            sourceNode.connect(analyser);

            const freq = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
              if (!analyser) return;
              analyser.getByteFrequencyData(freq);
              const len = 128;
              const arr = new Array(len);
              for (let i = 0; i < len; i++) arr[i] = (i < freq.length ? freq[i] : 0) / 255;
              try { if (typeof window.livelyAudioListener === 'function') window.livelyAudioListener(arr); } catch {}
              rafId = requestAnimationFrame(tick);
            };
            rafId = requestAnimationFrame(tick);

            setStatus(src === 'tv' ? 'TV stream' : (src === 'mic' ? 'microphone' : 'system audio'));
            const b = getEl('toggleAudioBtn'); if (b) b.textContent = 'Stop Audio';
            try { window.electronAPI?.log?.('info', 'Audio react start', src); } catch {}
          } catch (e) {
            setStatus('error');
            try { window.electronAPI?.log?.('error', 'Audio react error', e?.message || String(e)); } catch {}
          }
        }

        function stopAudio() {
          if (rafId) cancelAnimationFrame(rafId); rafId = null;
          if (sourceNode) { try { sourceNode.disconnect(); } catch {} sourceNode = null; }
          if (analyser) { try { analyser.disconnect(); } catch {} analyser = null; }
          if (audioCtx) { try { audioCtx.close(); } catch {} audioCtx = null; }
          if (audioStream && audioStream !== window.currentTvStream) {
            try { audioStream.getTracks().forEach(t => t.stop()); } catch {}
          }
          audioStream = null;
          const b = getEl('toggleAudioBtn'); if (b) b.textContent = 'Start Audio';
          setStatus('idle');
          try { window.electronAPI?.log?.('info', 'Audio react stop'); } catch {}
        }

        async function loadProfile() {
          try {
            const loaded = await window.electronAPI?.loadConfig?.();
            cfg = loaded && typeof loaded === 'object' ? loaded : {};
            const select = getEl('audioSourceSelect');
            const saved = cfg?.audio?.source || 'system';
            if (select) select.value = saved;
          } catch {}
        }

        async function saveProfileSource(value) {
          try {
            cfg = cfg && typeof cfg === 'object' ? cfg : {};
            cfg.audio = cfg.audio && typeof cfg.audio === 'object' ? cfg.audio : {};
            cfg.audio.source = value;
            await window.electronAPI?.saveConfig?.(cfg);
          } catch {}
        }

        window.addEventListener('DOMContentLoaded', () => {
          loadProfile().then(() => {
            const b = getEl('toggleAudioBtn');
            const sel = getEl('audioSourceSelect');
            if (b) b.addEventListener('click', () => { if (audioCtx) stopAudio(); else startAudio(); });
            if (sel) sel.addEventListener('change', (e) => { const v = e.target.value; saveProfileSource(v); });
          });
        });

        // Expose for debugging
        window.__audioReact = { startAudio, stopAudio };
      })();
    </script>
